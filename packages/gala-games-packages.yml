note: >-
  All first-party client libraries are published to npm under the @gala-chain scope by
  the gala-devops (devops+npmjs@gala.games) and aschuler-gala (aschuler@gala.games)
  maintainer accounts, which is the ownership evidence for official: true. No PyPI,
  Maven Central, NuGet, RubyGems, crates.io, Packagist or pkg.go.dev distribution was
  found — GalaChain is a TypeScript-only SDK surface. The core SDK packages (@gala-chain/api,
  chaincode, client, test, cli, connect) share the SDK monorepo version and were all
  republished on 2026-08-14, so the SDK is actively maintained. The two DeFi packages
  (launchpad-sdk, launchpad-mcp-server) version independently out of a GitLab monorepo
  at gitlab.com/gala-games/defi/launchpad/sdk. @gala-chain/stream and @gala-chain/gswap-sdk
  are the stale entries: last published 2025-05-08 and 2025-11-18 respectively, both
  well behind the 3.1.x SDK line they sit alongside.
