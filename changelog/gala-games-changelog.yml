note: >-
  Gala publishes no product changelog page for any of its four public APIs. The only
  dated change record is the GitHub release feed for the GalaChain SDK, which tracks
  the chaincode framework and client libraries rather than the hosted API surface. A
  caller of the GalaChain Gateway, GalaConnect, the Block Explorer or the DeFi backend
  has no changelog at all: nothing announces when a deployed contract or a hosted
  endpoint changes. The gateway does surface a version (3.0.2) on its OpenAPI, but
  nothing records what changed between versions.

  Release notes are auto-generated from merged PR titles by galachain-release-bot.
  They are dated and linked, but not classified — nothing is marked breaking, and there
  is no migration guidance. Breaking-vs-additive below is inferred from the semver
  bump and the PR titles, and is marked as such.
covers: GalaChain SDK (@gala-chain/api, chaincode, client, connect, test, cli)
