apis:
- aid: gala-games:galachain-token-contract
  name: GalaChain Token Contract API
  description: 'The GalaChain asset-channel token contract, exposed over REST by the
    GalaChain Gateway. Covers fungible and non-fungible token classes, balances, allowances,
    minting, burning, locking, transfers, NFT collections, on-chain token swaps and
    cross-chain bridge-out requests. Every write is a signed DTO carrying a uniqueKey.'
