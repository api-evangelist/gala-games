aid: gala-games
name: Gala Games
description: 'Gala (formerly Gala Games) is a Web3 gaming and entertainment company
  that operates GalaChain, a Hyperledger Fabric based Layer 1 built for games, music
  and film. Its public API surface is REST-first rather than RPC. The GalaChain Gateway
  publishes an OpenAPI document per deployed chaincode contract (token, DEX v3, launchpad,
  fee and public key) across eighteen channel/contract pairs including per-game channels
  such as mirandus, championsarena and thewalkingdeadempires. GalaConnect exposes token
  swaps, headless wallet creation and cross-chain operations at api-galaswap.gala.com,
  a Block Explorer API serves blocks, transactions and balances, and the Gala DeFi
  backend serves pool, trading, liquidity and leaderboard data for GalaSwap. Write
  operations are authenticated by secp256k1 request signatures rather than bearer tokens,
  and every write carries a uniqueKey that GalaChain enforces as an idempotency key.'
