note: >-
  Every /.well-known/ path was probed on nine Gala hosts and NOT ONE returned a real
  document. No security.txt, no OIDC discovery, no OAuth authorization-server or
  protected-resource metadata, no api-catalog, no ai-plugin.json, no agent card. This
  is a recorded absence, not a failed run — no WellKnown or SecurityTxt pointer is
  emitted in apis.yml, because a pointer would assert Gala serves a surface it does
  not.

  Two hosts are soft-404 traps and are called out explicitly: gala.com/connect.gala.com
  and swap.gala.com/galaswap.gala.com are single-page apps whose catch-all returns
  HTTP 200 with the SAME HTML shell (44,106 and 95,146 bytes respectively) for every
  path requested, including /llms.txt and every /.well-known/* path. Those 200s are
  scored here as misses. A naive probe that trusted the status code would have
  credited Gala with a security.txt, an OIDC configuration, an api-catalog, an
  ai-plugin and an A2A agent card, all of which are the same marketing page.

  gala.games and galachain.com both 404 the SPA shell on most paths but returned 200
  with a shorter shell on three paths on gala.games; those are the same catch-all
  behaviour and are recorded as misses for the same reason.
