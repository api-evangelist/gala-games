  summary: >-
    Every galachain.com and gala.com host serves a Cloudflare-managed robots.txt
    carrying a Content-Signal declaration: `Content-Signal: search=yes,ai-train=no,use=reference`
    with Allow: / for the default agent, plus explicit Disallow: / for Amazonbot,
    Applebot-Extended, Bytespider, CCBot, ClaudeBot, CloudflareBrowserRenderingCrawler,
    Google-Extended, GPTBot and meta-externalagent. It cites Article 4 of EU Directive
    2019/790 as the reservation of rights.
  note: >-
    This is the only machine-readable agent-consent signal Gala publishes, and it is
    restrictive. Recorded here rather than in a WellKnown pointer because a robots.txt
    Content-Signal is not a /.well-known/ document.
