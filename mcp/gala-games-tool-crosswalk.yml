note: >-
  Gala's MCP server and Gala's OpenAPI documents describe DIFFERENT backends. The
  MCP server wraps @gala-chain/launchpad-sdk, which talks to the Gala Launchpad
  backend (lpad-backend-prod1.defi.gala.com) — a host that answers 401 at its root
  and publishes no OpenAPI. The public OpenAPI surface is the GalaChain Gateway,
  GalaConnect, Block Explorer and the Gala DeFi backend. Where a Launchpad tool and
  a DeFi-backend operation clearly perform the same job against the same GSwap DEX,
  the row is bound with confidence medium and the binding is marked `semantic`, NOT
  `rest` — the tool does not literally call that operationId, it calls the Launchpad
  backend's own equivalent. Bonding-curve tools bind to the on-chain launchpad
  contract, which IS the settlement layer the Launchpad backend submits to; those
  are `chaincode` bindings. No row asserts a call path that was observed. Live
  tools/list introspection was not possible: the server is stdio-only, so there is no
  anonymous endpoint to introspect and the real inputSchemas remain unverified.
