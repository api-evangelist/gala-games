gaps:
- The GalaChain Gateway, GalaConnect, Block Explorer and DeFi backend APIs — the four
  surfaces Gala actually documents with OpenAPI — have no MCP server at all. The only
  MCP server covers Launchpad, which has no public OpenAPI.
- No remote/hosted MCP endpoint, so there is no agent-reachable Gala surface without a
  local install.
