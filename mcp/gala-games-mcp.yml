generated: '2026-08-16'
method: searched
status: published
source: https://www.npmjs.com/package/@gala-chain/launchpad-mcp-server
deployment:
  mode: local-stdio
  install: npx -y @gala-chain/launchpad-mcp-server@latest
  package: https://www.npmjs.com/package/@gala-chain/launchpad-mcp-server
  auth: api-key
  verified: searched
  note: >-
    Gala ships an MCP server as an npm package only. There is NO hosted remote MCP
    endpoint — nothing an agent can POST to without a human first installing and
    running the package on a machine. The credential is a wallet private key supplied
    as the PRIVATE_KEY environment variable; omitting it starts the server in a
    read-only mode where every fetch/query tool still works and only signing
    operations (buy, sell, transfer, launch, graduate) are refused. Established from
    the package's published README and npm registry metadata, not from a live
    tools/list — the server is stdio, so there is no anonymous endpoint to introspect.
server:
  name: gala-launchpad
  transport: stdio
  binary: gala-launchpad-mcp
  package: '@gala-chain/launchpad-mcp-server'
  version: 5.1.1
  published: '2026-08-12'
  license: MIT
  repository: https://gitlab.com/gala-games/defi/launchpad/sdk
  directory: packages/mcp-server
  publisher: Gala Launchpad Team (dev@gala-launchpad.com); npm maintainers include
    devops+npmjs@gala.games and aschuler@gala.games
  backs: '@gala-chain/launchpad-sdk 5.1.1 (Gala Launchpad backend API, 273 public methods)'
configuration:
  claude_desktop:
    command: npx
    args: ['-y', '@gala-chain/launchpad-mcp-server@latest']
  claude_code_full_access: claude mcp add "galachain-launchpad" -- env PRIVATE_KEY=0x...
    ENVIRONMENT=production npx -y @gala-chain/launchpad-mcp-server@latest
  claude_code_read_only: claude mcp add "galachain-launchpad-readonly" -- env ENVIRONMENT=production
    npx -y @gala-chain/launchpad-mcp-server@latest
  environment:
  - name: PRIVATE_KEY
    required: false
    description: Ethereum wallet private key. Omit for read-only mode.
  - name: ENVIRONMENT
    required: false
    default: production
    values: [development, production]
  - name: DEBUG
    required: false
  - name: TIMEOUT
    required: false
    default: '30000'
  - name: ETHEREUM_RPC_URL
    required: false
  - name: SOLANA_RPC_URL
    required: false
counts:
  tools_claimed: 310
  prompts_claimed: 292
  tool_categories_claimed: 38
  tools_named_in_readme: 98
  note: >-
    The package advertises 310 tools and 292 prompts. 98 distinct tool names are
