generated: '2026-08-16'
method: searched
source: https://connect.gala.com/info/swagger.json (info.description + responses) + https://raw.githubusercontent.com/GalaChain/sdk/main/docs/chaincode-development.md
docs: https://docs.galachain.com/latest/chaincode-development/
format: vendor
rfc9457: false
note: >-
  Gala publishes no application/problem+json anywhere. There are three distinct error
  envelopes across the four public APIs, and an integrator has to handle all three.
  The chain-level envelope is the interesting one: it is returned on a HTTP success as
  well, because a GalaChain contract error is a successful HTTP round-trip carrying a
  failed transaction.
envelopes:
- id: galachain-response
  used_by: [GalaChain Gateway, GalaConnect /galachain/* passthrough]
  content_type: application/json
  fields:
  - {name: Status, description: 1 on success; error status otherwise}
  - {name: Message, description: human-readable description of the error}
  - {name: ErrorCode, description: numeric code mapped to the corresponding HTTP code}
  - {name: ErrorKey, description: autogenerated string key derived from the error class
      name}
  - {name: ErrorPayload, description: optional object with additional information}
  guarantees:
  - When a contract method throws, no state changes are saved to the ledger.
  - The error is logged and the transaction is still recorded in transaction history.
  - The response is always a GalaChainResponse object, never a raw exception.
- id: galaconnect-application-error
  used_by: [GalaConnect]
  content_type: application/json
  fields:
  - {name: error, description: 'error code string, e.g. INVALID_BODY or NOT_FOUND'}
  - {name: errorId, description: unique id for this occurrence; quote it to Gala support}
  note: May carry additional properties with request-validation failure detail.
- id: galaconnect-bubbled-chain-error
  used_by: [GalaConnect]
  content_type: application/json
  fields:
  - {name: message, description: description of the underlying chain error}
  - {name: error, description: object containing ErrorKey and further detail}
  - {name: errorId, description: unique id for this occurrence}
error_classes:
  source: '@gala-chain/api ChainError hierarchy'
  description: >-
    ChainError extends the Node Error class and adds a code property mapped to an HTTP
    status, a key property autogenerated from the class name, and an optional payload.
    These are the predefined classes whose keys appear as ErrorKey on the wire.
  classes:
  - {name: ValidationError, http: 400}
  - {name: UnauthorizedError, http: 401}
  - {name: PaymentRequiredError, http: 402}
  - {name: ForbiddenError, http: 403}
  - {name: NotFoundError, http: 404}
  - {name: ConflictError, http: 409}
  - {name: NoLongerAvailableError, http: 410}
  - {name: DefaultError, http: 500}
  - {name: RuntimeError, http: 500}
  - {name: NotImplementedError, http: 501}
named_errors:
- key: UniqueTransactionConflictError
  trigger: A second transaction submitted with a uniqueKey that has already committed.
  class: ConflictError
  remediation: This is the idempotency guarantee firing, not a fault. Treat it as
    confirmation that the original write already landed; do not retry with a new key
    unless you intend a second distinct transaction.
- key: ValidationFailedError
  trigger: DTO validation failed — a required field missing, an expired dtoExpiresAt,
    or an unmet contract-level precondition such as a multisig signature count.
  class: ValidationError
  remediation: Re-validate the DTO with createValidDTO before signing.
problems:
- status: 400
  title: Invalid request body or parameters
  envelope: galaconnect-application-error
  example_code: INVALID_BODY
  source_operation: openapi/gala-games-galaconnect-openapi.json
  remediation: Check required fields and that the body matches the documented schema.
    Note that the signature is computed over the alphabetically-sorted, deterministically
    stringified body, so a field-order mistake surfaces here as a 401 rather than a 400.
- status: 401
  title: Signature validation failed or invalid wallet address
  envelope: galaconnect-application-error
  source_operation: openapi/gala-games-galaconnect-openapi.json
  remediation: Confirm the X-Wallet-Address header matches the signing key, that
    signerPublicKey is base64, that the signature s value was normalized to the lower
    half of the secp256k1 curve order, and that the public key is registered on chain
    via GetPublicKey.
- status: 404
  title: Resource not found
  envelope: galaconnect-application-error
  source_operation: openapi/gala-games-galaconnect-openapi.json
- status: 409
  title: Conflict
  envelope: galachain-response
  error_key: UniqueTransactionConflictError
  remediation: Either a replayed uniqueKey, or a serialization failure from concurrent
    writes against the same wallet. Serialize writes per wallet.
- status: 429
  title: Too Many Requests
  envelope: galaconnect-application-error
  headers: [Retry-After]
  remediation: Wait the number of seconds given in Retry-After. The GalaConnect global
    limit is 20 requests per 10 seconds.
  source: rate-limits/gala-games-rate-limits.yml
- status: 500
  title: Server error during operation or GalaChain communication
  envelope: galaconnect-bubbled-chain-error
  source_operation: openapi/gala-games-galaconnect-openapi.json
  remediation: Record errorId and contact support@gala.com.
gaps:
- The GalaChain Gateway OpenAPI documents only a 200 response per operation. No 4xx or
  5xx responses are declared on any of the 71 asset-channel contract operations, so an
  agent reading the spec alone cannot know what failure looks like — the error contract
  exists only in prose in the SDK docs.
- The Gala DeFi backend OpenAPI likewise declares no error responses across its 316
  operations.
- No error-code registry is published. ErrorKey values are described as autogenerated
  from class names, so the full set is discoverable only by reading the SDK source.
