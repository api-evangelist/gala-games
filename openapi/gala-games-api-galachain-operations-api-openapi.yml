        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/SignedRequest'
              - type: object
                required:
                - tokenInstances
                properties:
                  tokenInstances:
                    type: array
                    description: The tokens to burn
                    items:
                      type: object
                      required:
                      - quantity
