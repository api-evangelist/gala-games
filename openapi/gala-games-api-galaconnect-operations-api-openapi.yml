                        description: Unique identifier for the policy (MongoDB ObjectId as hex string)
                      policyName:
                        type: string
                        pattern: ^client\|ms_[a-f0-9]{24}$
                        description: The multi-signature wallet address
                      displayName:
                        type: string
                        description: Human-readable name for the policy
                      ownerWalletAddress:
                        type: string
                        description: The wallet address that owns/created this policy
                      threshold:
                        type: number
                        description: Number of signatures required to authorize transactions
                      signers:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            address:
                              type: string
                      transactionHash:
                        type: string
                        description: Optional. The transaction hash from GalaChain
                      status:
                        type: string
                        enum:
                        - created
                        - pending
                        - failed
                      expiration:
                        type: number
                        description: Optional. Number of days until policy expires
                      createdAt:
