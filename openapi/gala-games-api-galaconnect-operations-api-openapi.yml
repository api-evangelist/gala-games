  /v1/channels/{channel}/AuthorizeFee:
    post:
      tags:
      - 'API: GalaConnect Operations'
      summary: Authorize Cross-Channel Fee
      description: Use this endpoint to pay a cross-channel fee. See the `Fees` section above for important information about cross-channel fees.
      parameters:
      - in: header
        name: X-Wallet-Address
        required: true
        schema:
          type: string
          description: The wallet address of the wallet whose keys are being used to sign the request.
          example: client|0123456789abcdef01234567
      - in: path
        name: channel
        required: true
        schema:
          type: string
          description: The target channel for the operation you need to pay a fee for. You should read this from the `channel` property in the response from the `/fee` endpoint for your desired operation.
          example: music
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/SignedRequest'
              - type: object
                required:
                - authority
                - quantity
                properties:
                  authority:
                    type: string
                    description: This must be your wallet address and must match the key used to sign the request.
                    example: client|0123456789abcdef01234567
                  quantity:
                    type: string
                    description: The quantity of $GALA to pay for the fee. This is a decimal number represented as a string, with no trailing zeroes after the decimal place.
                    example: '100'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - authorizeResponse
                - creditResponse
                properties:
                  authorizeResponse:
                    type: object
                    description: A receipt for the transaction to authorize (pay) $GALA on the asset channel.
                    required:
                    - authority
                    - authorization
                    - created
                    - feeAuthorizationKey
                    - quantity
                    - txId
                    properties:
                      authority:
                        type: string
                        example: client|0123456789abcdef01234567
                        description: The wallet address that authorized the fee (yours).
                      authorization:
                        type: string
                        example: '{\"authority\":\"client|635f048ab243d7eb7f5ba044\",\"quantity\":\"1\",\"signature\":\"c1bfd9f4a0d657b6f23e8a66fb1197045c53e70007388246dd4a57a74b6579935467c979bdf6d7aab5c00b450ac41cd19801f4d45644de74a8e967ffb353b3fc1b\",\"trace\":{\"spanId\":\"1934648603122828225\",\"traceId\":\"3789661451710399155\"},\"uniqueKey\":\"gyri-studio-1740775581262-0.727670207162787\"}'
                        description: The full request you sent to this endpoint, augmented with some additional trace information, and serialized into a string.
                      created:
                        type: number
                        example: 1740775582867
                        description: Timestamp when the fee was authorized (in milliseconds).
                      feeAuthorizationKey:
                        type: string
                        example: client|635f048ab243d7eb7f5ba044$2025$02$28$1e351b6a2590eff147680337c608c95ccfbcd053ea890c3ef2fdfca1f3b51e30
                        description: Unique identifier for this fee authorization.
                      quantity:
                        type: string
                        example: '100'
                        description: Amount of GALA tokens authorized for the fee.
                      txId:
                        type: string
                        example: 1e351b6a2590eff147680337c608c95ccfbcd053ea890c3ef2fdfca1f3b51e30
                        description: Transaction ID for the fee authorization.
                  creditResponse:
                    type: object
                    description: A receipt for the transaction to credit your fee balance on the target channel
                    required:
                    - authority
                    - authorization
                    - created
                    - feeAuthorizationKey
                    - quantity
                    - txId
                    properties:
                      authority:
                        type: string
                        example: client|0123456789abcdef01234567
                        description: The wallet address that authorized the fee (yours).
                      authorization:
                        type: string
                        example: '{\"authority\":\"client|635f048ab243d7eb7f5ba044\",\"quantity\":\"1\",\"signature\":\"c1bfd9f4a0d657b6f23e8a66fb1197045c53e70007388246dd4a57a74b6579935467c979bdf6d7aab5c00b450ac41cd19801f4d45644de74a8e967ffb353b3fc1b\",\"trace\":{\"spanId\":\"1934648603122828225\",\"traceId\":\"3789661451710399155\"},\"uniqueKey\":\"gyri-studio-1740775581262-0.727670207162787\"}'
                        description: The full request you sent to this endpoint, augmented with some additional trace information, and serialized into a string.
                      created:
                        type: number
                        example: 1740775582867
                        description: Timestamp when the fee was authorized (in milliseconds).
                      feeAuthorizationKey:
                        type: string
                        example: client|635f048ab243d7eb7f5ba044$2025$02$28$1e351b6a2590eff147680337c608c95ccfbcd053ea890c3ef2fdfca1f3b51e30
                        description: Unique identifier for this fee authorization.
                      quantity:
                        type: string
                        example: '100'
                        description: Amount of GALA tokens authorized for the fee.
                      txId:
                        type: string
                        example: 1e351b6a2590eff147680337c608c95ccfbcd053ea890c3ef2fdfca1f3b51e30
                        description: Transaction ID for the fee credit.
