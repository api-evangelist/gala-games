                      collection:
                        type: string
                        example: SILK
                wantedTokenClass:
                  $ref: '#/components/schemas/TokenClass'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
