                    example: Multi-signature policy not found
        '500':
          description: Server error retrieving the policy.
components:
  schemas:
    SwapOffered:
      type: object
      required:
      - quantity
      - tokenInstance
      properties:
        quantity:
          type: string
          example: '10'
          description: The quantity of token offered.
        tokenInstance:
          $ref: '#/components/schemas/TokenInstance'
    SwapWanted:
      type: object
      required:
      - quantity
      - tokenInstance
      properties:
        quantity:
          type: string
          example: '10'
          description: The quantity of token wanted.
        tokenInstance:
          $ref: '#/components/schemas/TokenInstance'
    TokenInstance:
      allOf:
      - $ref: '#/components/schemas/TokenClass'
      - type: object
        required:
        - instance
        properties:
          instance:
            type: string
            example: '0'
            description: The instance of the token (always "0" for fungible tokens)
    TokenClass:
      type: object
      required:
      - collection
      - category
      - type
      - additionalKey
      properties:
        collection:
          type: string
          example: GALA
        category:
          type: string
          example: Unit
        type:
          type: string
          example: none
        additionalKey:
          type: string
          example: none
    SignedRequest:
      required:
      - signature
      - signerPublicKey
      - uniqueKey
      properties:
        signature:
          type: string
          example: MEUCIQCnXjZicvodRl0Hwyv6V1a3VU9WMsaVIxThVm0FTeuESwIgKDvv7z23QslMY6mEgSjzCK8A5LR7LV2WLCf+3CgPkPA=
        signerPublicKey:
          type: string
          example: Anm+Zn753LusVaBilc6HCwcCm/zbLc4o2VnygVsW+BeY
        uniqueKey:
          type: string
          example: galaconnect-operation-0123456789
    NewSwap:
      type: object
      required:
      - offered
      - wanted
      - uses
      properties:
        offered:
          type: array
          items:
            $ref: '#/components/schemas/SwapOffered'
        wanted:
          type: array
          items:
            $ref: '#/components/schemas/SwapWanted'
        uses:
          type: string
          example: '1'
    Swap:
      allOf:
      - $ref: '#/components/schemas/NewSwap'
      - type: object
        required:
        - created
        - expires
        - offeredBy
        - swapRequestId
        - usesSpent
        properties:
          created:
            type: integer
            example: 1711982017548
            description: The date and time the swap was created in milliseconds since the Unix epoch.
          expires:
            type: integer
            example: 0
            description: The date and time the swap expires. Normally this will be zero, indicating no expiration.
          offeredBy:
            type: string
            example: client|123456789abcdef012345678
            description: The wallet address of the user who created the swap.
          swapRequestId:
            type: string
            example: GCTSR17063182605809b5fca57bfcfe2b9bf9ecf8593ced274ff28bed85fb23eb6fb6f33978a343df2
            description: The unique identifier of the swap.
          usesSpent:
            type: string
            example: '0'
            description: The number of uses of the swap that have been spent.
    SwappableToken:
      allOf:
      - $ref: '#/components/schemas/TokenClass'
      - type: object
        required:
        - decimals
        - currentPrices
        - swappable
        - trending
        properties:
          swappable:
            type: boolean
            example: true
            description: Whether the token can be swapped on GalaConnect.
          trending:
            type: boolean
            example: true
            description: Whether the token is trending.
          symbol:
            type: string
            example: GALA
            description: The symbol of the token on GalaChain. Note that more than one token may have the same symbol. To differentiate tokens properly, you should use the combination of `collection`, `category`, `type`, and `additionalKey`.
          name:
            type: string
            example: Gala
            description: The name of the token on GalaChain.
          priceSymbol:
            type: string
            example: USD
            description: The symbol used to fetch the token's price (generally from the CoinGecko API). This property usually is not of interest to developers.
          decimals:
            type: integer
            example: 8
            description: The number of decimal places in the token.
          currentPrices:
            type: object
            properties:
              usd:
                type: number
                example: 0.063152
                description: The current price of the token in USD. This property may be missing if this information is not available.
              usd24hChange:
                type: number
                example: -6.421877021583615
                description: The amount the price has changed in the last 24 hours. This property may be if this information is not available.
