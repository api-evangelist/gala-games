gaps:
- The five GalaChain Gateway documents define ZERO components.schemas and inline every
  request shape, so no entity graph can be derived from them directly — the entities
  above come from GalaConnect and the DeFi backend, which model the same objects.
- Several DeFi backend schemas (LeaderboardSeason, IncentiveProgramPosition,
  IncentiveProgramAnalytics, Object) are declared with no properties at all, so their
  shape is undiscoverable from the spec.
- GalaConnect declares TokenClassWithSupply, TokenInstance, Swap, SwappableToken,
  AllowanceType and MintConfiguration as empty schemas — named but unmodelled.
