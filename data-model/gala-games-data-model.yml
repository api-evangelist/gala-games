docs: https://docs.galachain.com/latest/concepts/chain-key-design/
note: >-
  Derived from component schemas and from the composite-key convention that runs
  through every Gala surface. GalaChain has no opaque object ids of the Stripe cus_/in_
  kind. Identity is a COMPOSITE KEY: a token is addressed by the tuple
  collection|category|type|additionalKey, and a specific unit of it adds instance. That
  tuple appears as four sibling fields in JSON and as a pipe-joined string on the wire
  (GALA|Unit|none|none). Understanding that one convention is most of what an
  integrator needs.
identity_conventions:
- name: token class key
  form: 'collection|category|type|additionalKey'
  example: GALA|Unit|none|none
  json_form: four sibling string properties
  note: '"none" is a real, required value — it is how an unused axis is expressed, not
    a null.'
- name: token instance key
  form: 'collection|category|type|additionalKey|instance'
  note: instance is a BigNumber-as-string. Fungible token balances use instance "0";
    an NFT uses a nonzero instance.
- name: user address
  forms:
  - 'client|<24 hex chars>'
  - 'eth|<40 hex chars, no 0x>'
  note: The pipe-prefixed form identifies the identity provider.
- name: swapRequestId
  form: 'NUL-delimited composite: <NUL>GCTSR<NUL><created-ms><NUL><64 hex><NUL>'
  note: Contains embedded NUL characters. It must be passed back verbatim, which is a
    real serialization hazard for any client that sanitizes control characters.
- name: poolHash
  note: The DEX pool identifier used across the DeFi backend incentive and explore
    endpoints.
- name: txid
  form: 64 hex chars
  note: Returned on a committed transaction; the join key to the Block Explorer.
- name: uniqueKey
  form: 'caller-supplied; GalaConnect requires the prefix galaconnect-operation-'
  note: Not an entity id — an idempotency key, but it is the only caller-controlled
    identifier in the system.
