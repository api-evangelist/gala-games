shared_rules:
  idempotency: Every write carries a caller-supplied uniqueKey enforced at the ledger.
    One key per logical operation, reused across retries. UniqueTransactionConflictError
    means the operation already committed.
  authentication: secp256k1 signature over the alphabetically-sorted, deterministically-stringified
    request body. No bearer tokens, no OAuth, no developer API keys.
  response_handling: HTTP 200 does not mean success. Branch on the envelope — GalaChainResponse.Status
    on the gateway, BaseResponseDto.status on the DeFi backend, error/errorId on GalaConnect.
  concurrency: Never issue concurrent writes for the same wallet; serialization failures
    return HTTP 409.
  numbers: All quantities are BigNumber-as-string. Never JSON numbers.
